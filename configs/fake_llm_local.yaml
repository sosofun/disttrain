distributed:
  backend: gloo
  world_size: 1
  init_method: env://
  timeout_sec: 1800

stages:
  encoder:
    enabled: false
  llm:
    enabled: true
    tp_size: 1
    dp_size: 1
    model_cls: LLMModel
  decoder:
    enabled: false

pipeline:
  schedule: gpipe
  num_micro_batches: 2
  overlap_p2p_comm: false

training:
  global_batch_size: 16
  micro_batch_size: 2
  grad_accum_steps: 1
  precision: fp32
  device: cpu
  max_steps: 5
  seq_len: 32
  vocab_size: 2048
  hidden_size: 128
  optimizer:
    type: adamw
    lr: 1.0e-3
    weight_decay: 0.01
