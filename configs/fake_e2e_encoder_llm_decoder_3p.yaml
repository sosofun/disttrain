distributed:
  backend: gloo
  world_size: 3
  init_method: env://
  timeout_sec: 1800

stages:
  encoder:
    enabled: true
    tp_size: 1
    dp_size: 1
    model_cls: EncoderModel
    input_modalities: [image, audio]
  llm:
    enabled: true
    tp_size: 1
    dp_size: 1
    model_cls: LLMModel
  decoder:
    enabled: true
    tp_size: 1
    dp_size: 1
    model_cls: DecoderModel
    output_modalities: [audio]

pipeline:
  schedule: 1f1b
  num_micro_batches: 4
  overlap_p2p_comm: false

training:
  global_batch_size: 48
  micro_batch_size: 2
  grad_accum_steps: 1
  precision: fp32
  device: cpu
  max_steps: 4
  seq_len: 32
  vocab_size: 2048
  hidden_size: 128
  image_size: 16
  audio_length: 256
  optimizer:
    type: adamw
    lr: 1.0e-3
    weight_decay: 0.01
