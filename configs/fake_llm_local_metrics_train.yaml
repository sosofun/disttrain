distributed:
  backend: gloo
  world_size: 1
  init_method: env://
  timeout_sec: 1800
  grad_sync_bucket_mb: 8

stages:
  encoder:
    enabled: false
  llm:
    enabled: true
    tp_size: 1
    dp_size: 1
    model_cls: LLMModel
    activation_checkpoint: true
  decoder:
    enabled: false

pipeline:
  schedule: gpipe
  num_micro_batches: 2
  overlap_p2p_comm: false

training:
  global_batch_size: 16
  micro_batch_size: 2
  grad_accum_steps: 1
  precision: fp32
  device: cpu
  data_seed: 2026
  max_steps: 5
  seq_len: 32
  vocab_size: 2048
  hidden_size: 128
  io:
    enable_prefetch: true
    prefetch_size: 2
    pin_memory: true
    num_workers: 0
  optimizer:
    type: adamw
    lr: 1.0e-3
    weight_decay: 0.01
  metrics:
    level: minimal
    rank_scope: auto
    log_every_steps: 10
    groups:
      core:
        enabled: true
        every_n_steps: 1
      throughput:
        enabled: true
        every_n_steps: 1
      comm_summary:
        enabled: false
      p2p_detail:
        enabled: false
      io:
        enabled: false
      memory:
        enabled: false
